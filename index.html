<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>jakeboss101</title>
<meta name="description" content="Hi, I am jakeboss and I make thangs.">
<meta property="og:title" content="jakeboss101">
<meta property="og:description" content="Hi, I am jakeboss and I make thangs.">
<link rel="icon" href="img/buddy.png">
<style>
  :root {
    --paper: #f4f1ea;
    --ink: #161514;
    --soft: #6d6a64;
    --rule: #d8d3c8;
    --purple: #6f3fb0;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  main {
    max-width: 860px;
    margin: 0 auto;
    padding: 48px 28px 32px;
  }

  .name {
    font-size: 17px;
    font-weight: 600;
    letter-spacing: -.01em;
    margin: 0 0 18vh;
  }

  h1 {
    margin: 0 0 18vh;
    font-size: clamp(48px, 10vw, 108px);
    line-height: .98;
    letter-spacing: -.045em;
    font-weight: 700;
    max-width: 12ch;
  }

  h2 {
    margin: 0;
    padding-bottom: 12px;
    border-bottom: 2px solid var(--ink);
    font-size: 15px;
    font-weight: 600;
    letter-spacing: .02em;
  }

  section { margin-bottom: 72px; }

  .row {
    display: grid;
    grid-template-columns: 64px 1fr auto;
    align-items: center;
    gap: 20px;
    padding: 22px 0;
    border-bottom: 1px solid var(--rule);
    color: inherit;
    text-decoration: none;
  }
  .row.plain { grid-template-columns: 1fr auto; }

  .row img {
    width: 64px;
    height: 64px;
    border-radius: 14px;
    display: block;
  }

  .title {
    font-size: 26px;
    font-weight: 700;
    letter-spacing: -.02em;
  }
  .what {
    margin-top: 4px;
    font-size: 17px;
    color: var(--soft);
  }
  .note {
    margin-top: 8px;
    font-size: 13px;
    font-weight: 600;
    color: var(--purple);
  }
  .go {
    font-size: 15px;
    color: var(--soft);
    white-space: nowrap;
  }

  .row:hover .title { color: var(--purple); }
  .row:hover .go { color: var(--ink); }
  .row:focus-visible { outline: 3px solid var(--purple); outline-offset: 4px; }

  footer {
    max-width: 860px;
    margin: 0 auto;
    padding: 0 28px 48px;
    font-size: 13px;
    color: var(--soft);
  }

  @media (max-width: 560px) {
    .row { grid-template-columns: 52px 1fr; }
    .row img { width: 52px; height: 52px; border-radius: 12px; }
    .row .go { display: none; }
    .row.plain { grid-template-columns: 1fr; }
    .title { font-size: 22px; }
  }
</style>
</head>
<body>
<main>
  <p class="name">jakeboss101</p>

  <h1>Hi, I am jakeboss and I make thangs.</h1>

  <section>
    <h2>Thangs</h2>
    <a class="row" href="https://buddysburrow.com">
      <img src="img/buddy.png" alt="Buddy, a fuzzy purple friend, waving">
      <div>
        <div class="title">Buddy</div>
        <div class="what">An AI friend who lives on your phone.</div>
        <div class="note">Coming soon to iPhone</div>
      </div>
      <span class="go">buddysburrow.com ↗</span>
    </a>
  </section>

  <section>
    <h2>Elsewhere</h2>
    <a class="row plain" href="https://github.com/jakeboss101">
      <div class="title">GitHub</div>
      <span class="go">github.com/jakeboss101 ↗</span>
    </a>
    <a class="row plain" href="https://huggingface.co/buddysburrow">
      <div class="title">Hugging Face</div>
      <span class="go">huggingface.co/buddysburrow ↗</span>
    </a>
  </section>
</main>

<footer>© 2026 jakeboss101</footer>
</body>
</html>
